<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Updating...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    background: #0a0a0f;
    color: #fff;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(99,102,241,0.3), transparent 70%);
    border-radius: 50%;
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.2); opacity: 1; }
  }
  h1 {
    font-size: 48px;
    font-weight: 300;
    letter-spacing: 8px;
    position: relative;
    z-index: 1;
  }
  h1::after {
    content: '';
    display: inline-block;
    width: 4px; height: 40px;
    background: #6366f1;
    margin-left: 6px;
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .bar {
    width: 300px;
    height: 3px;
    background: rgba(255,255,255,0.1);
    margin-top: 40px;
    border-radius: 2px;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }
  .bar::after {
    content: '';
    position: absolute;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, #6366f1, transparent);
    animation: slide 1.5s infinite;
  }
  @keyframes slide {
    0% { left: -40%; }
    100% { left: 100%; }
  }
</style>
</head>
<body>
  <h1>UPDATING</h1>
  <div class="bar"></div>
</body>
</html>
