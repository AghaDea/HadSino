<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guessino</title>
<script>
(function () {
  try {
    var id = localStorage.getItem('gz_user_id');
    if (id) {
      location.replace('home/');
    } else {
      location.replace('login/');
    }
  } catch (e) {
    location.replace('login/');
  }
})();
</script>
</head>
<body>
<p style="font-family:system-ui;text-align:center;margin-top:40vh;color:#888;">
  <a href="login/">Login</a> · <a href="home/">Home</a>
</p>
</body>
</html>
