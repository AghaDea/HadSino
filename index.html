<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SYSTEM FAILURE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0078d7;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }
  #boot {
    position: fixed;
    inset: 0;
    background: #000;
    color: #aaa;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    padding: 20px;
    z-index: 1000;
    overflow: hidden;
    line-height: 1.5;
  }
  #boot .line { opacity: 0; animation: bootIn 0.05s forwards; }
  #boot .ok { color: #0f0; }
  #boot .fail { color: #f44; }
  #boot .warn { color: #fa0; }
  @keyframes bootIn { to { opacity: 1; } }
  #matrix {
    position: fixed;
    inset: 0;
    z-index: 1;
    opacity: 0.08;
    pointer-events: none;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.15) 0px,
      rgba(0,0,0,0.15) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 3;
    animation: scan 8s linear infinite;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.4) 100%);
    pointer-events: none;
    z-index: 4;
  }
  @keyframes scan {
    0% { background-position: 0 0; }
    100% { background-position: 0 100px; }
  }
  .container {
    padding: 70px 100px;
    max-width: 1200px;
    position: relative;
    z-index: 2;
  }
  .sad {
    font-size: 180px;
    font-weight: 100;
    line-height: 1;
    margin-bottom: 30px;
  }
  h1 {
    font-size: 34px;
    font-weight: 300;
    margin-bottom: 20px;
    min-height: 45px;
  }
  .desc {
    font-size: 18px;
    font-weight: 300;
    line-height: 1.6;
    margin-bottom: 30px;
    max-width: 800px;
    min-height: 60px;
  }
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #fff;
    margin-left: 2px;
    animation: blink 0.8s infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .progress-section { margin: 30px 0; }
  .percent { font-size: 22px; margin-bottom: 12px; }
  .progress-bar {
    width: 320px;
    height: 6px;
    background: rgba(255,255,255,0.2);
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #fff, #aee);
    width: 0%;
    transition: width 0.3s ease;
    box-shadow: 0 0 10px #fff;
  }
  .info-section { margin-top: 40px; font-size: 15px; line-height: 2; }
  .info-section .label {
    display: inline-block;
    min-width: 160px;
    opacity: 0.85;
    color: #cfe9ff;
  }
  .actions { margin-top: 40px; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 10px 28px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(10px);
  }
  .btn:hover {
    background: rgba(255,255,255,0.2);
    border-color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  }
  .btn.primary { background: #fff; color: #0078d7; border-color: #fff; }
  .btn.primary:hover { background: #e8f4ff; }
  .btn.danger { border-color: #ff6b6b; color: #ffcccc; }
  .btn.danger:hover { background: rgba(255,100,100,0.2); }
  .qr-code {
    position: fixed;
    bottom: 50px;
    left: 100px;
    width: 110px;
    height: 110px;
    background: #fff;
    padding: 8px;
    z-index: 2;
  }
  .terminal {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.97);
    color: #0f0;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    padding: 12px 18px;
    max-height: 220px;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.4s ease;
    z-index: 10;
    border-top: 1px solid #0f0;
  }
  .terminal.show { transform: translateY(0); }
  .terminal-line { margin: 2px 0; white-space: pre; }
  .terminal-line.error { color: #ff4444; }
  .terminal-line.warn { color: #ffaa00; }
  .terminal-line.info { color: #00aaff; }
  .terminal-line.hex { color: #888; }
  .modal {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: #1a1a1a;
    color: #fff;
    min-width: 580px;
    max-width: 700px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 100;
    border: 1px solid #333;
  }
  .modal.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: all;
  }
  .modal-header {
    background: linear-gradient(180deg, #2a2a2a, #1a1a1a);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    border-bottom: 1px solid #333;
  }
  .modal-close {
    cursor: pointer;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    font-size: 18px;
  }
  .modal-close:hover { background: #e81123; }
  .tabs {
    display: flex;
    background: #111;
    border-bottom: 1px solid #333;
  }
  .tab {
    padding: 10px 20px;
    cursor: pointer;
    font-size: 13px;
    color: #888;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab:hover { color: #fff; }
  .tab.active { color: #fff; border-bottom-color: #0078d7; }
  .modal-body {
    padding: 20px;
    font-size: 13px;
    line-height: 1.8;
    min-height: 280px;
    max-height: 400px;
    overflow-y: auto;
  }
  .modal-body::-webkit-scrollbar { width: 8px; }
  .modal-body::-webkit-scrollbar-track { background: #111; }
  .modal-body::-webkit-scrollbar-thumb { background: #444; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #222;
  }
  .stat-row .k { color: #888; }
  .stat-row .v { color: #fff; font-family: 'Consolas', monospace; }
  .graph {
    height: 60px;
    background: #0a0a0a;
    border: 1px solid #333;
    margin: 10px 0;
    position: relative;
    overflow: hidden;
  }
  .graph canvas { width: 100%; height: 100%; display: block; }
  .graph-label {
    position: absolute;
    top: 4px;
    left: 8px;
    font-size: 11px;
    color: #888;
    font-family: 'Consolas', monospace;
  }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    animation: pulse 1.5s infinite;
    vertical-align: middle;
  }
  .status-dot.red { background: #ff4444; box-shadow: 0 0 8px #ff4444; }
  .status-dot.yellow { background: #ffaa00; box-shadow: 0 0 8px #ffaa00; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translate(0); }
    20% { transform: translate(-4px, 2px); }
    40% { transform: translate(4px, -2px); }
    60% { transform: translate(-3px, -2px); }
    80% { transform: translate(3px, 2px); }
  }
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="boot"></div>
<canvas id="matrix"></canvas>

<div class="container" id="main" style="display:none;">
  <div class="sad">:(</div>
  <h1 id="title"></h1>
  <div class="desc" id="desc"></div>
  
  <div class="progress-section">
    <div class="percent"><span id="percent">0</span>% complete</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
  
  <div class="info-section">
    <div><span class="label">Stop code:</span> CRITICAL_PROCESS_DIED</div>
    <div><span class="label">What failed:</span> retry_handler.sys</div>
    <div><span class="label">Error code:</span> 0x000000EF</div>
    <div><span class="label">Status:</span> <span class="status-dot red"></span>Critical Failure</div>
  </div>
  
  <div class="actions">
    <button class="btn primary" onclick="retry()">Try Again</button>
    <button class="btn" onclick="openModal('details')">Advanced Details</button>
    <button class="btn" onclick="toggleTerminal()">System Logs</button>
    <button class="btn danger" onclick="forceRestart()">Force Restart</button>
  </div>
</div>

<div class="qr-code">
  <canvas id="qrCanvas" width="94" height="94"></canvas>
</div>

<div class="terminal" id="terminal"></div>
<div class="particles" id="particles"></div>

<div class="modal" id="modal">
  <div class="modal-header">
    <span id="modalTitle">System Diagnostics</span>
    <div class="modal-close" onclick="closeModal()">×</div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="modal-body" id="modalBody"></div>
</div>

<script>
// Boot sequence
const bootLines = [
  { t: 'BIOS v3.21.0 - Phoenix Technologies', c: '' },
  { t: 'CPU: Intel Core i7-12700K @ 3.60GHz', c: 'ok' },
  { t: 'Memory Test: 16384 MB OK', c: 'ok' },
  { t: 'Detecting IDE drives...', c: '' },
  { t: '  Primary Master: Samsung SSD 980 PRO 1TB', c: 'ok' },
  { t: '  Primary Slave: None', c: '' },
  { t: 'Initializing USB controllers... [OK]', c: 'ok' },
  { t: 'Loading kernel modules...', c: '' },
  { t: '  [    0.000000] Linux version 5.15.0-generic', c: 'info' },
  { t: '  [    0.123456] ACPI: Core revision 20210715', c: 'info' },
  { t: '  [    0.234567] smpboot: CPU0: Intel(R) Core(TM) i7', c: 'info' },
  { t: 'Mounting filesystems...', c: '' },
  { t: 'Starting system services...', c: '' },
  { t: '  [ OK ] Started Network Manager', c: 'ok' },
  { t: '  [ OK ] Started D-Bus System Message Bus', c: 'ok' },
  { t: '  [ FAIL ] retry_handler.service', c: 'fail' },
  { t: '  [ WARN ] Kernel panic - not syncing: Fatal exception', c: 'warn' },
  { t: '', c: '' },
  { t: '*** CRITICAL ERROR DETECTED ***', c: 'fail' },
  { t: 'Dumping physical memory to disk...', c: '' },
  { t: 'Initiating blue screen sequence...', c: 'warn' },
];

const bootEl = document.getElementById('boot');
let bootIdx = 0;
const bootTimer = setInterval(() => {
  if (bootIdx >= bootLines.length) {
    clearInterval(bootTimer);
    setTimeout(() => {
      bootEl.style.transition = 'opacity 0.5s';
      bootEl.style.opacity = '0';
      setTimeout(() => {
        bootEl.style.display = 'none';
        document.getElementById('main').style.display = 'block';
        startMain();
      }, 500);
    }, 600);
    return;
  }
  const line = bootLines[bootIdx];
  const div = document.createElement('div');
  div.className = 'line ' + (line.c || '');
  div.textContent = line.t || ' ';
  bootEl.appendChild(div);
  bootIdx++;
}, 80);

// Matrix rain
const matrix = document.getElementById('matrix');
const mctx = matrix.getContext('2d');
matrix.width = window.innerWidth;
matrix.height = window.innerHeight;
const cols = Math.floor(matrix.width / 14);
const drops = Array(cols).fill(0);
const chars = '01ABCDEFabcdef#$%&@'.split('');
function drawMatrix() {
  mctx.fillStyle = 'rgba(0, 120, 215, 0.05)';
  mctx.fillRect(0, 0, matrix.width, matrix.height);
  mctx.fillStyle = '#fff';
  mctx.font = '13px Consolas';
  for (let i = 0; i < drops.length; i++) {
    const text = chars[Math.floor(Math.random() * chars.length)];
    mctx.fillText(text, i * 14, drops[i] * 14);
    if (drops[i] * 14 > matrix.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(drawMatrix, 60);

// Typewriter
function typeWriter(el, text, speed = 30) {
  return new Promise(resolve => {
    let i = 0;
    el.innerHTML = '<span class="cursor"></span>';
    const timer = setInterval(() => {
      if (i >= text.length) {
        clearInterval(timer);
        el.innerHTML = text;
        resolve();
        return;
      }
      el.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
      i++;
    }, speed);
  });
}

async function startMain() {
  await typeWriter(document.getElementById('title'), 'Your PC ran into a problem and needs to restart.', 25);
  await typeWriter(document.getElementById('desc'), "We're just collecting some error info, and then we'll restart for you.", 20);
  startProgress();
}

// Progress
let progress = 0;
function startProgress() {
  const percentEl = document.getElementById('percent');
  const fillEl = document.getElementById('progressFill');
  const timer = setInterval(() => {
    progress += Math.random() * 2 + 0.3;
    if (progress >= 100) {
      progress = 100;
      clearInterval(timer);
      setTimeout(() => {
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 400);
        progress = 0;
        fillEl.style.width = '0%';
        percentEl.textContent = '0';
        setTimeout(startProgress, 1500);
      }, 2000);
      return;
    }
    percentEl.textContent = Math.floor(progress);
    fillEl.style.width = progress + '%';
  }, 250);
}

// QR
function drawQR() {
  const c = document.getElementById('qrCanvas');
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, 94, 94);
  ctx.fillStyle = '#000';
  for (let i = 0; i < 18; i++) {
    for (let j = 0; j < 18; j++) {
      if (Math.random() > 0.5) ctx.fillRect(i * 5 + 2, j * 5 + 2, 4, 4);
    }
  }
  [[2,2],[72,2],[2,72]].forEach(([x,y]) => {
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, y, 20, 20);
    ctx.fillStyle = '#000';
    ctx.fillRect(x, y, 20, 20);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x+4, y+4, 12, 12);
    ctx.fillStyle = '#000';
    ctx.fillRect(x+7, y+7, 6, 6);
  });
}
drawQR();

// Terminal
function toggleTerminal() {
  const term = document.getElementById('terminal');
  if (term.classList.contains('show')) {
    term.classList.remove('show');
    return;
  }
  term.innerHTML = '';
  term.classList.add('show');
  const logs = [
    { t: '[KERNEL] System diagnostic initialized', c: 'info' },
    { t: '[KERNEL] Loading module: ntoskrnl.exe', c: 'info' },
    { t: '[DRIVER] retry_handler.sys loaded at 0xFFFFF80123456789', c: 'info' },
    { t: '[WARN] Module retry_handler.sys not responding (timeout: 30s)', c: 'warn' },
    { t: '[ERROR] IRQL_NOT_LESS_OR_EQUAL at retry_handler.sys+0x3A2F', c: 'error' },
    { t: '[ERROR] Critical process (svchost.exe) terminated unexpectedly', c: 'error' },
    { t: '[KERNEL] Attempting automatic recovery...', c: 'info' },
    { t: '[ERROR] Recovery failed: 0x000000EF', c: 'error' },
    { t: '[DUMP] Writing 16384 MB to C:\\Windows\\MEMORY.DMP', c: 'info' },
    { t: '[HEX] 00000000: 4D 5A 90 00 03 00 00 00 04 00 00 00 FF FF 00 00', c: 'hex' },
    { t: '[HEX] 00000010: B8 00 00 00 00 00 00 00 40 00 00 00 00 00 00 00', c: 'hex' },
    { t: '[HEX] 00000020: 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00', c: 'hex' },
    { t: '[WARN] System unstable - immediate restart required', c: 'warn' },
    { t: '[ERROR] Fatal exception in kernel mode - Bugcheck 0xEF', c: 'error' },
    { t: '[KERNEL] Collecting telemetry data...', c: 'info' },
  ];
  logs.forEach((log, i) => {
    setTimeout(() => {
      const line = document.createElement('div');
      line.className = 'terminal-line ' + log.c;
      line.textContent = log.t;
      term.appendChild(line);
      term.scrollTop = term.scrollHeight;
    }, i * 180);
  });
}

// Modal with tabs
const modalData = {
  details: {
    title: 'Advanced System Diagnostics',
    tabs: ['Overview', 'Hardware', 'Memory', 'Network'],
    content: [
      () => `
        <div class="stat-row"><span class="k">Stop Code</span><span class="v">CRITICAL_PROCESS_DIED</span></div>
        <div class="stat-row"><span class="k">Error Code</span><span class="v">0x000000EF</span></div>
        <div class="stat-row"><span class="k">Failed Module</span><span class="v">retry_handler.sys</span></div>
        <div class="stat-row"><span class="k">Module Address</span><span class="v">0xFFFFF80123456789</span></div>
        <div class="stat-row"><span class="k">Bugcheck P1</span><span class="v">0xFFFFA80123456789</span></div>
        <div class="stat-row"><span class="k">Bugcheck P2</span><span class="v">0x0000000000000000</span></div>
        <div class="stat-row"><span class="k">OS Build</span><span class="v">22621.1.amd64fre</span></div>
        <div class="stat-row"><span class="k">Time</span><span class="v">${new Date().toLocaleString()}</span></div>
        <div class="stat-row"><span class="k">Uptime</span><span class="v">2d 14:32:18</span></div>
      `,
      () => `
        <div class="stat-row"><span class="k">CPU</span><span class="v">Intel Core i7-12700K</span></div>
        <div class="stat-row"><span class="k">Cores / Threads</span><span class="v">12 / 20</span></div>
        <div class="stat-row"><span class="k">Base Clock</span><span class="v">3.60 GHz</span></div>
        <div class="stat-row"><span class="k">GPU</span><span class="v">NVIDIA RTX 3080</span></div>
        <div class="stat-row"><span class="k">VRAM</span><span class="v">10 GB GDDR6X</span></div>
        <div class="stat-row"><span class="k">Storage</span><span class="v">Samsung 980 PRO 1TB</span></div>
        <div class="stat-row"><span class="k">Motherboard</span><span class="v">ASUS ROG Z690</span></div>
        <div class="stat-row"><span class="k">BIOS Version</span><span class="v">3.21.0</span></div>
        <div class="stat-row"><span class="k">CPU Temp</span><span class="v" style="color:#ff4444;">92°C ⚠</span></div>
      `,
      () => `
        <div class="stat-row"><span class="k">Total RAM</span><span class="v">16384 MB</span></div>
        <div class="stat-row"><span class="k">Used</span><span class="v">15872 MB</span></div>
        <div class="stat-row"><span class="k">Available</span><span class="v">512 MB</span></div>
        <div class="stat-row"><span class="k">Usage</span><span class="v" style="color:#ff4444;">96.9%</span></div>
        <div class="graph"><canvas id="memGraph"></canvas><div class="graph-label">MEMORY USAGE (60s)</div></div>
        <div class="stat-row"><span class="k">Page File</span><span class="v">8192 MB</span></div>
        <div class="stat-row"><span class="k">Committed</span><span class="v">24576 MB</span></div>
        <div class="stat-row"><span class="k">Commit Limit</span><span class="v">32768 MB</span></div>
      `,
      () => `
        <div class="stat-row"><span class="k">Adapter</span><span class="v">Intel Wi-Fi 6 AX201</span></div>
        <div class="stat-row"><span class="k">Status</span><span class="v" style="color:#ff4444;">Disconnected</span></div>
        <div class="stat-row"><span class="k">IP Address</span><span class="v">192.168.1.105</span></div>
        <div class="stat-row"><span class="k">Subnet</span><span class="v">255.255.255.0</span></div>
        <div class="stat-row"><span class="k">Gateway</span><span class="v">192.168.1.1</span></div>
        <div class="stat-row"><span class="k">DNS</span><span class="v">8.8.8.8, 8.8.4.4</span></div>
        <div class="stat-row"><span class="k">Packets Lost</span><span class="v" style="color:#ff4444;">87%</span></div>
        <div class="stat-row"><span class="k">Latency</span><span class="v" style="color:#ffaa00;">2340ms</span></div>
      `
    ]
  }
};

let currentTab = 0;
function openModal(key) {
  const data = modalData[key];
  document.getElementById('modalTitle').textContent = data.title;
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  data.tabs.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'tab' + (i === 0 ? ' active' : '');
    div.textContent = t;
    div.onclick = () => switchTab(i);
    tabsEl.appendChild(div);
  });
  currentTab = 0;
  document.getElementById('modalBody').innerHTML = data.content[0]();
  document.getElementById('modal').classList.add('show');
  setTimeout(() => initGraph(), 100);
}

function switchTab(i) {
  currentTab = i;
  document.querySelectorAll('.tab').forEach((t, idx) => {
    t.classList.toggle('active', idx === i);
  });
  document.getElementById('modalBody').innerHTML = modalData.details.content[i]();
  if (i === 2) setTimeout(() => initGraph(), 50);
}

function initGraph() {
  const canvas = document.getElementById('memGraph');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  const data = Array(60).fill(0).map(() => 80 + Math.random() * 20);
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    data.forEach((v, i) => {
      const x = (i / (data.length - 1)) * canvas.width;
      const y = canvas.height - (v / 100) * canvas.height;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.lineTo(canvas.width, canvas.height);
    ctx.lineTo(0, canvas.height);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0, 255, 0, 0.1)';
    ctx.fill();
    data.shift();
    data.push(80 + Math.random() * 20);
  }
  const g = setInterval(draw, 500);
  const obs = new MutationObserver(() => {
    if (!document.getElementById('memGraph')) { clearInterval(g); obs.disconnect(); }
  });
  obs.observe(document.getElementById('modalBody'), { childList: true });
  draw();
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function retry() {
  document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), 400);
  spawnParticles(window.innerWidth / 2, window.innerHeight / 2, 30);
  openModal('details');
}

function forceRestart() {
  document.body.classList.add('shake');
  document.body.style.transition = 'filter 0.5s';
  document.body.style.filter = 'brightness(3)';
  setTimeout(() => {
    document.body.style.filter = 'brightness(0)';
    setTimeout(() => location.reload(), 800);
  }, 300);
}

function spawnParticles(x, y, count) {
  const container = document.getElementById('particles');
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    const angle = (Math.PI * 2 * i) / count;
    const dist = 50 + Math.random() * 100;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    p.style.transition = 'all 0.8s ease-out';
    container.appendChild(p);
    requestAnimationFrame(() => {
      p.style.transform = `translate(${dx}px, ${dy}px)`;
      p.style.opacity = '0';
    });
    setTimeout(() => p.remove(), 800);
  }
}

document.addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') spawnParticles(e.clientX, e.clientY, 8);
});

window.addEventListener('resize', () => {
  matrix.width = window.innerWidth;
  matrix.height = window.innerHeight;
});
</script>
