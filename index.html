<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Updating...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
    background-size: 400% 400%;
    animation: bg 12s ease infinite;
    overflow: hidden;
  }
  @keyframes bg {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .card {
    padding: 50px 70px;
    border-radius: 24px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    text-align: center;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .spinner {
    width: 60px;
    height: 60px;
    margin: 0 auto 25px;
    border: 4px solid rgba(255,255,255,0.15);
    border-top-color: #7c5cff;
    border-right-color: #00d4ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #7c5cff, #00d4ff, #7c5cff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 3s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .dots { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #00d4ff;
    animation: bounce 1.2s infinite ease-in-out both;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%,80%,100% { transform: scale(0.4); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <div class="text">Updating<span class="dots"><span></span><span></span><span></span></span></div>
  </div>
</body>
</html>
